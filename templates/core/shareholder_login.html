{% extends "base.html" %}
{% block title %}Shareholder Login &middot; {{ branding.business_name }}{% endblock %}
{% block content %}
<div class="grid" style="max-width:420px; margin:40px auto;">
  <div class="card">
    <h2>Shareholder Login</h2>
    <p style="color:var(--color-text-muted); font-size:.85rem; margin-top:0;">
      For shareholders and the Company to view company revenue performance.
    </p>
    {% if error %}<p class="badge badge-danger">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
