{% extends "base.html" %}
{% block content %}
<div class="grid" style="max-width:420px; margin:40px auto;">
  <div class="card">
    <h2>Login</h2>
    {% if error %}<p class="badge badge-danger">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Username or phone" required>
      <input type="password" name="password" placeholder="Password" required>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
