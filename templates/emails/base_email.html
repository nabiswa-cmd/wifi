<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>

<body style="
    margin:0;
    padding:0;
    background:#FAFAF7;
    font-family:Arial,Helvetica,sans-serif;
">

    <div style="
        max-width:600px;
        margin:40px auto;
        background:#ffffff;
        padding:50px 40px;
        border:1px solid #E4E4DC;
    ">

        <div style="
            text-align:center;
            margin-bottom:35px;
            padding-bottom:22px;
            border-bottom:3px solid #c9a52e;
        ">
            <div style="
                font-size:28px;
                letter-spacing:5px;
                font-weight:700;
                color:#7fae2e;
            ">
                {{ business_name|upper }}
            </div>
            {% if tagline %}
            <div style="
                margin-top:8px;
                color:#5b5760;
                font-size:12px;
                letter-spacing:2px;
            ">
                {{ tagline|upper }}
            </div>
            {% endif %}
        </div>

        <h1 style="
            font-size:26px;
            font-weight:400;
            margin-bottom:20px;
            color:#221E22;
        ">
            {{ heading }}
        </h1>

        {% for paragraph in paragraphs %}
        <p style="
            color:#555555;
            font-size:16px;
            line-height:1.7;
            margin:0 0 18px 0;
        ">
            {{ paragraph }}
        </p>
        {% endfor %}

        {% if highlight %}
        <div style="
            margin:35px 0;
            padding:25px;
            background:#F1F3E9;
            text-align:center;
        ">
            <div style="
                font-size:30px;
                font-weight:700;
                letter-spacing:2px;
                color:#7fae2e;
            ">
                {{ highlight }}
            </div>
        </div>
        {% endif %}

        <hr style="
            border:none;
            border-top:1px solid #eeeeee;
            margin:35px 0;
        ">

        <p style="
            color:#999999;
            font-size:12px;
            text-align:center;
            margin:0;
        ">
            {{ business_name }}{% if location %} &middot; {{ location }}{% endif %}
        </p>

    </div>

</body>
</html>
